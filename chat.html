<!doctype html>
<!--
  chat.html - test chat UI for the USB Inference Key. One file, no build, no dependencies.
  Double-click it. Target either the local endpoint (http://localhost:8080) or the public
  Cloudflare URL from status.bat, paste the API key, Connect, type. Nothing is installed or
  written anywhere: the key stays in memory unless you tick "remember on this PC" (browser
  localStorage on THIS browser profile). Quick-tunnel URLs change every cloudflared restart -
  if the public URL 404s, re-run status.bat and paste the new one.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>USB Key - test chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#101418; --panel:#171d23; --line:#2a333c; --fg:#d7dee6; --dim:#8a97a3;
          --acc:#4cc38a; --err:#e06c75; --user:#22303c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:15px/1.5 "Segoe UI", system-ui, sans-serif; display:flex; flex-direction:column; height:100vh; }
  header  { background:var(--panel); border-bottom:1px solid var(--line); padding:10px 14px;
            display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  header .sep { width:1px; height:24px; background:var(--line); }
  input, select, button, textarea {
            background:#0d1115; color:var(--fg); border:1px solid var(--line); border-radius:6px;
            padding:6px 9px; font:inherit; }
  input:focus, textarea:focus { outline:none; border-color:var(--acc); }
  button  { cursor:pointer; }
  button:hover  { border-color:var(--acc); }
  button:disabled { opacity:.45; cursor:default; }
  label   { color:var(--dim); font-size:13px; display:inline-flex; align-items:center; gap:5px; }
  #dot    { width:10px; height:10px; border-radius:50%; background:#555; flex:none; }
  #status { color:var(--dim); font-size:13px; max-width:34vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #pub { width:300px; display:none; }
  #chat   { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg    { max-width:78%; padding:9px 13px; border-radius:10px; white-space:pre-wrap; overflow-wrap:break-word; }
  .me     { align-self:flex-end; background:var(--user); }
  .them   { align-self:flex-start; background:var(--panel); border:1px solid var(--line); }
  .err    { align-self:center; color:var(--err); font-size:13px; text-align:center; }
  .meta   { align-self:flex-end; color:var(--dim); font-size:12px; }
  footer  { background:var(--panel); border-top:1px solid var(--line); padding:10px 14px;
            display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap; }
  #input  { flex:1; min-height:42px; max-height:180px; resize:vertical; }
  details { font-size:13px; color:var(--dim); }
  details textarea { width:220px; height:54px; }
  .knob   { width:74px; }
</style>
</head>
<body>
<header>
  <div id="dot"></div>
  <label><input type="radio" name="tgt" value="local" checked> Local</label>
  <input id="port" class="knob" value="8080" title="local port (config\settings.ini)">
  <label><input type="radio" name="tgt" value="pub"> Public</label>
  <input id="pub" placeholder="https://xxxx.trycloudflare.com (from status.bat)">
  <div class="sep"></div>
  <input id="key" type="password" style="width:230px" placeholder="API key (config\api.key)" autocomplete="off">
  <label><input type="checkbox" id="remember"> remember on this PC</label>
  <button id="connect">Connect</button>
  <span id="status">not connected</span>
</header>

<div id="chat"><div class="err" style="color:var(--dim)">Connect first - pick Local or Public, paste the key, hit Connect.</div></div>

<footer>
  <details><summary>knobs</summary>
    <div style="display:flex;gap:8px;padding-top:6px">
      <textarea id="sys" placeholder="system prompt (optional)"></textarea>
      <label>temp <input id="temp" class="knob" value="0.7"></label>
      <label>max tok <input id="maxtok" class="knob" value="512"></label>
    </div>
  </details>
  <textarea id="input" placeholder="type a message - Enter sends, Shift+Enter newline"></textarea>
  <button id="send" disabled>Send</button>
  <button id="stop" disabled>■ Stop</button>
</footer>

<script>
'use strict';
const $ = id => document.getElementById(id);
let model = null, abort = null;

const base = () => document.querySelector('input[name=tgt]:checked').value === 'local'
  ? 'http://localhost:' + ($('port').value.trim() || '8080')
  : $('pub').value.trim().replace(/\/+$/, '');
const headers = () => ({ 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + $('key').value.trim() });
const note   = (t, ok) => { $('status').textContent = t; $('dot').style.background = ok ? 'var(--acc)' : 'var(--err)'; };

// persistence is strictly opt-in (host hygiene: nothing left unless asked)
try {
  const s = JSON.parse(localStorage.getItem('usbkey-chat') || '{}');
  if (s.remember) { $('key').value = s.key || ''; $('pub').value = s.pub || ''; $('remember').checked = true; }
} catch (e) {}
$('remember').onchange = () => { try {
  localStorage.setItem('usbkey-chat', JSON.stringify($('remember').checked
    ? { remember:1, key:$('key').value.trim(), pub:$('pub').value.trim() } : {}));
} catch (e) {} };

function showPub() { $('pub').style.display =
  document.querySelector('input[name=tgt][value=pub]').checked ? 'inline-block' : 'none'; }
document.querySelectorAll('input[name=tgt]').forEach(r => r.onchange = showPub);

async function connect() {
  const url = base();
  if (!url) { note('enter a URL first', false); return; }
  note('connecting...', false);
  try {
    const r = await fetch(url + '/v1/models', { headers: headers() });
    if (r.status === 401 || r.status === 403) { note('401 - wrong API key', false); return; }
    if (!r.ok) { note('HTTP ' + r.status + ' - check URL (' + r.statusText + ')', false); return; }
    const j = await r.json();
    model = (j.data && j.data[0] && j.data[0].id) || 'model';
    note('connected - model: ' + model, true);
    $('send').disabled = false;
  } catch (e) {
    note('cannot reach ' + url + ' - run run.bat on the key? public URL changes on every tunnel restart', false);
  }
}
$('connect').onclick = connect;

function bubble(cls, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls; d.textContent = text;
  $('chat').appendChild(d); $('chat').scrollTop = 1e9;
  return d;
}

let ac = null;
async function send() {
  const text = $('input').value.trim();
  if (!text || ac) return;
  $('input').value = '';
  bubble('me', text);
  const them = bubble('them', '…');
  const hist = [];
  document.querySelectorAll('.msg').forEach(m => {
    if (m === them) return;
    hist.push({ role: m.classList.contains('me') ? 'user' : 'assistant', content: m.textContent });
  });
  const body = { model, messages: hist, stream: true,
                 temperature: parseFloat($('temp').value) || 0.7,
                 max_tokens: parseInt($('maxtok').value) || 512 };
  if ($('sys').value.trim()) body.messages.unshift({ role:'system', content: $('sys').value.trim() });

  ac = new AbortController(); $('stop').disabled = false; $('send').disabled = true;
  const t0 = performance.now(); let tFirst = 0, out = '';
  try {
    const r = await fetch(base() + '/v1/chat/completions',
      { method:'POST', headers: headers(), body: JSON.stringify(body), signal: ac.signal });
    if (r.status === 401) throw new Error('401 - wrong API key (paste it in the box and Connect again)');
    if (!r.ok) throw new Error('HTTP ' + r.status + ': ' + (await r.text()).slice(0, 300));
    const rd = r.body.getReader(), dec = new TextDecoder(); let buf = '';
    while (true) {
      const { done, value } = await rd.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const line = buf.slice(0, i).split('\n').find(l => l.startsWith('data: '));
        buf = buf.slice(i + 2);
        if (!line) continue;
        const payload = line.slice(6);
        if (payload === '[DONE]') continue;
        try {
          const d = JSON.parse(payload).choices[0].delta.content;
          if (d) { if (!tFirst) tFirst = performance.now(); out += d; them.textContent = out; $('chat').scrollTop = 1e9; }
        } catch (e) {}
      }
    }
    if (!out) them.textContent = '(empty response)';
    const t1 = performance.now();
    const m = document.createElement('div'); m.className = 'meta';
    m.textContent = tFirst
      ? `first token ${((tFirst - t0)/1000).toFixed(2)}s  ·  ≈${(out.split(/\S+/).length / ((t1 - tFirst)/1000)).toFixed(1)} tok/s  ·  total ${((t1 - t0)/1000).toFixed(1)}s`
      : `no token stream (total ${((t1 - t0)/1000).toFixed(1)}s)`;
    $('chat').appendChild(m);
  } catch (e) {
    if (e.name === 'AbortError') { them.textContent = out + ' ■'; }
    else {
      them.remove();
      bubble('err', (e.message || String(e)) + (e instanceof TypeError
        ? '  —  endpoint unreachable: is the key running (run.bat), and is the public URL fresh (status.bat)?' : ''));
    }
  } finally {
    ac = null; $('stop').disabled = true; $('send').disabled = false; $('chat').scrollTop = 1e9;
  }
}
$('send').onclick = send;
$('stop').onclick = () => ac && ac.abort();
$('input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
</script>
</body>
</html>
