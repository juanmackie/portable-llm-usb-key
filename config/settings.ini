# USB Inference Key - settings (read by scripts\serve.ps1)

# ---- endpoint ----
port=8080
# 0.0.0.0 = also reachable on the LAN; 127.0.0.1 = only through the tunnel
host=0.0.0.0
# on = publish a public https://<random>.trycloudflare.com URL via bin\tools\cloudflared.exe
# off = local/LAN only. (If this file is missing, the tunnel stays OFF - never exposed by accident.)
# Only the literal value 'on' enables the tunnel: a blank or corrupt value keeps it OFF.
tunnel=on
# Stable public URL (optional, named tunnel): create a tunnel in Cloudflare Zero Trust ->
# Tunnels, then set BOTH keys below - the token and the https hostname the tunnel serves.
# Set one without the other and the tunnel does not start (fail closed). The token is passed
# to cloudflared via the environment, never on a command line. Leave both blank for the quick
# tunnel above, whose random address changes on every cloudflared restart.
tunnel_token=
tunnel_url=
# model name clients send in "model": (llama.cpp also accepts the file path)
alias=local
# off = no browser UI, API only (recommended while the port is reachable)
webui=off

# ---- memory / speed ----
# 99 = offload every layer the GPU can hold (fast; the default).
#      If the model cannot fit the GPU, serve.ps1 falls back to ngl=auto for that host
#      and remembers it in config\profile.txt, so it never retries a doomed offload.
# auto = llama.cpp --fit picks a conservative CPU/GPU split (safe on 6-8 GB cards, slower).
# a number (e.g. 56) forces exactly that many layers onto the GPU.
ngl=99
ctx_size=8192
batch=2048
ubatch=512
kvct=q8_0
flash_attn=auto
threads=0

# ---- model / backend overrides (blank = auto) ----
# model: full path to one .gguf. Blank = biggest model on the key that this laptop can hold.
# backend: blank = try cuda, then vulkan, then cpu. It switches on its own if one cannot load
# the model (a CUDA build without kernels for your card falls through to vulkan, then cpu -
# and since the build can also see ZERO devices and silently run the CPU instead, serve.ps1
# probes `--list-devices` before ever choosing cuda).
# Pin with one name (vulkan) or an order (vulkan,cpu). bin\cuda needs cudart64_12 + cublas64_12
# present on the host, and carries SASS only for sm_50/61/70/75/80/90 with no PTX, so RTX 30xx
# laptop (sm_86) and RTX 50xx (sm_120) cards are served by the vulkan build.
model=
backend=
# Laptops with an iGPU + dGPU: the vulkan build prefers the discrete card on its own, but if
# it picks wrong, pin it with the exact id from `bin\vulkan\llama-server.exe --list-devices`
# (e.g. Vulkan1). Wrong id = instant startup refusal with the name printed - a visible error,
# never a silent slowdown.
device=

# ---- speculative decoding ----
# none | draft-mtp | draft-simple | ngram-simple ...
# needs a model with MTP heads (or a matching *MTP* draft file); serve.ps1 falls back
# to none automatically if the server dies during load.
spec_type=none
spec_nmax=3
spec_pmin=0.75

# ---- host friendliness ----
# on = veto SYSTEM sleep while serving. The DISPLAY is never held: your screen
#      still blanks per your power plan. Nothing in the power plan is changed.
keepawake=on
