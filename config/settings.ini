# USB Inference Key - settings (read by scripts\serve.ps1)

# ---- endpoint ----
port=8080
# 0.0.0.0 = also reachable on the LAN; 127.0.0.1 = only through the tunnel
host=0.0.0.0
# on = publish a public https://<random>.trycloudflare.com URL via bin\tools\cloudflared.exe
# off = local/LAN only. (If this file is missing, the tunnel stays OFF - never exposed by accident.)
tunnel=on
# model name clients send in "model": (llama.cpp also accepts the file path)
alias=local
# off = no browser UI, API only (recommended while the port is reachable)
webui=off

# ---- memory / speed ----
# auto = let llama.cpp --fit choose the CPU/GPU split (right answer on 6-8 GB cards).
# a number (e.g. 99) forces that many layers to the GPU.
ngl=auto
ctx_size=8192
batch=2048
ubatch=512
kvct=q8_0
flash_attn=auto
threads=0

# ---- model / backend overrides (blank = auto) ----
# model: full path to one .gguf. Blank = biggest model on the key that this laptop can hold.
# backend: blank = try cuda, then vulkan, then cpu. It switches on its own if one cannot load
# the model (a CUDA build without kernels for your card falls through to vulkan, then cpu).
# Pin with one name (vulkan) or an order (vulkan,cpu). bin\cuda needs cudart64_12 + cublas64_12
# present on the host, and carries SASS only for sm_50/61/70/75/80/90 with no PTX, so RTX 50xx
# (sm_120) is served by the vulkan build.
model=
backend=

# ---- speculative decoding ----
# none | draft-mtp | draft-simple | ngram-simple ...
# needs a model with MTP heads (or a matching *MTP* draft file); serve.ps1 falls back
# to none automatically if the server dies during load.
spec_type=none
spec_nmax=3
spec_pmin=0.75

# ---- host friendliness ----
# on = veto SYSTEM sleep while serving. The DISPLAY is never held: your screen
#      still blanks per your power plan. Nothing in the power plan is changed.
keepawake=on
